---
# StarTree-only workflow. Builds the forked Vector as a distroless multiarch image.
#
# Required repository secrets:
#   STARTREE_REGISTRY_USERNAME  - repo.startreedata.io login
#   STARTREE_REGISTRY_PASSWORD  - repo.startreedata.io token/password

name: Build StarTree Vector (distroless)

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: "Upstream Vector version this release is based on, e.g. 0.49.0"
        required: true
        default: "0.49.0"
      build_number:
        description: "StarTree build number. 0.49.0 + 1 -> v0.49.0-ST-1"
        required: true
        default: "1"
      push:
        description: "Push to the registry (uncheck for a build-only dry run)"
        type: boolean
        default: true

# contents: write is needed to push the release git tag.
permissions:
  contents: write

concurrency:
  group: startree-distroless-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: repo.startreedata.io/external-docker-registry/vector
  DOCKERFILE: distribution/docker/distroless-static/Dockerfile
  # Cross.toml's `passthrough` is an ALLOWLIST -- env vars not listed there never
  # reach the build container. CARGO_INCREMENTAL and
  # CARGO_PROFILE_RELEASE_CODEGEN_UNITS are on it; CARGO_BUILD_JOBS is not.
  CARGO_INCREMENTAL: "0"

jobs:
  metadata:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      image_tags: ${{ steps.resolve.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the tag-existence check below sees existing tags.
          fetch-depth: 0

      - id: resolve
        run: |
          set -euo pipefail
          VERSION="${{ inputs.base_version }}"
          BUILD="${{ inputs.build_number }}"
          TAG="v${VERSION}-ST-${BUILD}"

          # The Makefile names the tarball vector-${VERSION}-<triple>.tar.gz and the
          # distroless Dockerfile globs `vector-0*`. Keep VERSION as the plain
          # upstream version -- the ST suffix belongs to the image tag only.
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::warning::base_version ($VERSION) does not match Cargo.toml ($CARGO_VERSION) on ${{ github.ref_name }}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          {
            echo "image_tags<<EOF"
            echo "${IMAGE}:${TAG}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Building $VERSION -> ${IMAGE}:${TAG}"

      # Fail in seconds rather than after a 90-minute build if this release
      # number was already cut.
      - name: Check the release tag is free
        if: inputs.push
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::git tag ${TAG} already exists; bump build_number"
            exit 1
          fi
          echo "${TAG} is free"

  build:
    name: Build ${{ matrix.triple }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds -- `cross` uses a same-arch container carrying the musl
          # toolchain, so there is no QEMU emulation on either leg.
          - triple: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - triple: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    env:
      # Makefile does `export VERSION ?= $(shell cargo vdev version)`, which would
      # build vdev just to name a file. Set it directly instead.
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # A clean Vector release build needs ~30 GB; hosted runners ship ~14 GB free
      # on /. Without this the build dies partway through with ENOSPC.
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/swift \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          df -h /

      # Pinned to the cross-rs version the scripts/cross/*.dockerfile images are
      # built FROM. Installed here rather than via `make cargo-install-cross`,
      # which is a no-op unless AUTOINSTALL=true and then runs `cargo clean`.
      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build musl tarball
        run: make package-${{ matrix.triple }}

      # cross builds as root inside the container; hand ownership back so
      # upload-artifact can read the results.
      - name: Fix artifact ownership
        run: sudo chown -R "$(id -u):$(id -g)" target/artifacts

      - name: Verify the binary is actually static
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify && tar -xzf target/artifacts/vector-*.tar.gz \
            -C /tmp/verify --strip-components=2
          file /tmp/verify/bin/vector
          # The old EC2 flow produced a glibc binary named "-musl". Catch that here
          # rather than in a CrashLoopBackOff on distroless/static.
          if ldd /tmp/verify/bin/vector 2>&1 | grep -qv 'not a dynamic executable'; then
            echo "::error::binary is dynamically linked; it will not run on distroless/static"
            ldd /tmp/verify/bin/vector || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vector-${{ matrix.triple }}
          path: target/artifacts/vector-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Build and push distroless image
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Both tarballs land in one context dir. The Dockerfile COPYs both and
      # extracts whichever matches `cat /etc/apk/arch` on the build platform.
      - uses: actions/download-artifact@v4
        with:
          pattern: vector-*-unknown-linux-musl
          path: target/artifacts
          merge-multiple: true

      - name: Show build context
        run: ls -la target/artifacts

      # Needed only for the `RUN ["vector", "--version"]` smoke test on the
      # non-native leg of the multi-platform build. Runs once, takes seconds.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: repo.startreedata.io
          username: ${{ secrets.STARTREE_REGISTRY_USERNAME }}
          password: ${{ secrets.STARTREE_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: target/artifacts
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ needs.metadata.outputs.image_tags }}
          # Buildx emits attestation manifests by default, which surface as
          # "unknown/unknown" entries in `imagetools inspect`. Off, so the manifest
          # matches the shape the current imagetools-stitched tag has.
          provenance: false

      - name: Verify manifest
        if: inputs.push
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ needs.metadata.outputs.tag }}"

  release:
    name: Tag the release
    needs: [metadata, build, publish]
    if: inputs.push
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Tagged only after publish succeeds, so a failed build never leaves an
      # orphan release tag behind.
      - name: Create and push the release tag
        run: |
          set -euo pipefail
          TAG="${{ needs.metadata.outputs.tag }}"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "$TAG" -m "StarTree release $TAG (upstream ${{ inputs.base_version }}, build ${{ inputs.build_number }})"
          git push origin "$TAG"
          echo "Tagged $(git rev-parse --short HEAD) as $TAG"

      - name: Summary
        run: |
          {
            echo "### StarTree Vector release \`${{ needs.metadata.outputs.tag }}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Built from | \`${{ github.ref_name }}\` |"
            echo "| Upstream base | \`${{ inputs.base_version }}\` |"
            echo "| StarTree build | \`${{ inputs.build_number }}\` |"
            echo
            echo "Images pushed:"
            echo '```'
            echo "${{ needs.metadata.outputs.image_tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
